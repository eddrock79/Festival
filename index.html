<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>The Banshee Labyrinth — Up Next</title>
<meta name="theme-color" content="#060507">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600&family=EB+Garamond:ital,wght@0,400;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#060507;
    --bone:#ece6d6;
    --bone-dim:rgba(236,230,214,.62);
    --green:#74e3c1;
    --ember:#e3492f;
    --line:rgba(236,230,214,.14);
    --line-soft:rgba(236,230,214,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100svh;
    background:
      radial-gradient(60vw 40vh at 50% -8%, rgba(116,227,193,.08), transparent 60%),
      radial-gradient(80vw 50vh at 90% 110%, rgba(227,73,47,.07), transparent 60%),
      var(--ink);
    color:var(--bone);
    font-family:'EB Garamond',serif;
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .veil{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background:radial-gradient(120vw 70vh at 50% 0%, rgba(0,0,0,0), rgba(0,0,0,.55) 85%);
    animation:breathe 9s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.85}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){ .veil{animation:none} }

  header{
    position:relative; z-index:1;
    text-align:center;
    padding:clamp(22px,7vw,34px) 16px clamp(10px,3vw,16px);
  }
  .brand{
    font-family:'Cinzel Decorative',serif;
    font-weight:700;
    font-size:clamp(1.35rem,7.2vw,1.9rem);
    letter-spacing:.02em;
    color:var(--bone);
    text-shadow:0 0 18px rgba(116,227,193,.18);
  }
  .eyebrow{
    margin-top:6px;
    font-family:'Cinzel',serif;
    font-size:clamp(.62rem,3vw,.72rem);
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--green);
  }
  .clock{
    margin-top:10px;
    font-family:'Cinzel',serif;
    font-size:clamp(.78rem,3.4vw,.9rem);
    letter-spacing:.08em;
    color:var(--bone-dim);
  }
  .clock .dot{
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background:var(--green); margin-right:7px; vertical-align:1px;
    box-shadow:0 0 8px rgba(116,227,193,.9);
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

  main{
    position:relative; z-index:1;
    max-width:560px; margin:0 auto;
    padding:6px 16px clamp(28px,8vw,40px);
  }

  .room{
    border:1px solid var(--line);
    border-radius:16px;
    padding:clamp(14px,4.6vw,20px) clamp(14px,4.6vw,18px);
    margin-top:14px;
    background:linear-gradient(180deg, rgba(255,255,255,.025), rgba(0,0,0,.18));
    position:relative;
    overflow:hidden;
  }
  .room::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:3px;
    background:linear-gradient(180deg, var(--green), transparent 85%);
    opacity:.7;
  }
  .room-head{
    display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    margin-bottom:4px;
  }
  .room-name{
    font-family:'Cinzel',serif; font-weight:600;
    letter-spacing:.13em; text-transform:uppercase;
    font-size:clamp(.82rem,3.6vw,.95rem);
    color:var(--bone);
  }
  .tag{
    font-family:'Cinzel',serif;
    font-size:clamp(.58rem,2.5vw,.65rem);
    letter-spacing:.14em; text-transform:uppercase;
    padding:3px 9px; border-radius:999px;
    white-space:nowrap;
  }
  .tag.now{ color:var(--ink); background:var(--green); }
  .tag.next{ color:var(--green); border:1px solid rgba(116,227,193,.5); }
  .tag.empty{ color:var(--bone-dim); border:1px solid var(--line); }

  .show-list{ margin:0; padding:0; list-style:none; }
  .show-item{
    padding:12px 0;
    border-top:1px solid var(--line-soft);
  }
  .show-item:first-child{ border-top:none; padding-top:8px; }

  .item-meta{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .item-day{
    font-family:'Cinzel',serif;
    font-size:clamp(.6rem,2.6vw,.68rem);
    letter-spacing:.1em; text-transform:uppercase;
    color:var(--green);
  }
  .item-day.today{ color:var(--bone-dim); }
  .item-time{
    font-family:'Cinzel',serif;
    font-size:clamp(.82rem,3.6vw,.94rem);
    color:var(--ember);
    letter-spacing:.02em;
  }

  .item-title{
    margin-top:4px;
    font-family:'Cinzel Decorative',serif; font-weight:700;
    font-size:clamp(1.08rem,4.8vw,1.3rem);
    line-height:1.2;
    color:var(--bone);
  }
  .item-desc{
    margin-top:5px;
    font-size:clamp(.92rem,3.8vw,1.02rem);
    line-height:1.48;
    color:var(--bone-dim);
  }

  .room-empty{
    margin-top:10px;
    font-style:italic;
    color:var(--bone-dim);
    font-size:clamp(.95rem,3.8vw,1.02rem);
  }

  footer{
    position:relative; z-index:1;
    text-align:center;
    padding:6px 16px clamp(20px,6vw,30px);
    font-family:'Cinzel',serif;
    font-size:clamp(.62rem,2.6vw,.7rem);
    letter-spacing:.1em; text-transform:uppercase;
    color:var(--bone-dim);
  }
  footer.error{ color:var(--ember); }
</style>
</head>
<body>
<div class="veil"></div>

<header>
  <div class="brand">The Banshee Labyrinth</div>
  <div class="eyebrow">Free Fringe · Up Next</div>
  <div class="clock"><span class="dot"></span><span id="clock">--:--</span></div>
</header>

<main id="rooms"></main>

<footer id="status">Loading today's listings…</footer>

<script>
(function(){
  "use strict";

  // ── Same Fringe listings sheet the bar boards already read from ──
  var SHEET_ID = "1tzT1xGauy1guCUOZnAFgN02ksZdttdCPxaMfFCwd7uA";
  var SHEET_TAB = "by_time";
  var REFRESH_MS = 90 * 1000;   // re-pull the sheet every 90s
  var TICK_MS    = 20 * 1000;   // re-check now/next every 20s without refetching
  var SHOWS_PER_ROOM = 6;
  var LOOKAHEAD_DAYS = 21;      // enough to fill 6 slots even near the end of the run

  var ROOMS = [
    { key:"cinema",     name:"Cinema",          match:/cinema/i },
    { key:"banqueting", name:"Banqueting Hall", match:/banquet/i },
    { key:"chamber",    name:"Chamber Room",    match:/chamber/i }
  ];

  var MONTHS = ["january","february","march","april","may","june","july","august",
                "september","october","november","december"];

  var state = { rows: [], ok: null };

  // ── CSV parsing (handles quoted fields with embedded commas/newlines) ──
  function parseCSV(text){
    var rows = [], row = [], field = "", inQ = false;
    for (var i = 0; i < text.length; i++){
      var c = text[i];
      if (inQ){
        if (c === '"'){
          if (text[i+1] === '"'){ field += '"'; i++; } else { inQ = false; }
        } else field += c;
      } else {
        if (c === '"') inQ = true;
        else if (c === ',') { row.push(field); field = ""; }
        else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
        else if (c === '\r'){ /* skip */ }
        else field += c;
      }
    }
    if (field.length || row.length){ row.push(field); rows.push(row); }
    return rows;
  }

  // ── Parse a "when" cell: "12:00 - 13:00 ● Banshee Labyrinth (Venue 156) Chamber Room ● 2-24 August." ──
  function parseWhen(str){
    if (!str) return null;
    var parts = String(str).split('\u25CF').map(function(s){ return s.trim(); }).filter(Boolean);
    if (parts.length < 3) return null;

    var timeMatch = parts[0].match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
    if (!timeMatch) return null;
    var startMin = (+timeMatch[1]) * 60 + (+timeMatch[2]);
    var endMin   = (+timeMatch[3]) * 60 + (+timeMatch[4]);

    var roomText = parts[1] || "";

    var dateText = (parts[2] || "").replace(/\.$/, "").trim();
    var monthMatch = dateText.match(/([A-Za-z]+)\s*$/);
    var monthName = monthMatch ? monthMatch[1].toLowerCase() : "";
    var monthIdx = MONTHS.indexOf(monthName);
    var dayPart = monthMatch ? dateText.slice(0, monthMatch.index).trim() : dateText;
    var segments = dayPart.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    var days = [];
    segments.forEach(function(seg){
      var m = seg.match(/^(\d{1,2})\s*-\s*(\d{1,2})$/);
      if (m){
        var a = +m[1], b = +m[2];
        for (var d = a; d <= b; d++) days.push(d);
      } else if (/^\d{1,2}$/.test(seg)){
        days.push(+seg);
      }
    });

    return {
      startMin: startMin, endMin: endMin, roomText: roomText, monthIdx: monthIdx, days: days,
      startLabel: timeMatch[1].padStart(2,'0') + ':' + timeMatch[2],
      endLabel: timeMatch[3].padStart(2,'0') + ':' + timeMatch[4]
    };
  }

  function fmtClock(d){
    var h = String(d.getHours()).padStart(2,'0');
    var m = String(d.getMinutes()).padStart(2,'0');
    return h + ':' + m;
  }

  function dayLabel(occDate, now){
    var startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var startOfOcc = new Date(occDate.getFullYear(), occDate.getMonth(), occDate.getDate());
    var diffDays = Math.round((startOfOcc - startOfToday) / 86400000);
    if (diffDays === 0) return { text: "Today", isToday: true };
    if (diffDays === 1) return { text: "Tomorrow", isToday: false };
    return { text: occDate.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' }), isToday: false };
  }

  // ── Build every future occurrence within the lookahead window, one per room ──
  function buildOccurrences(){
    var now = new Date();
    var byRoom = {};
    ROOMS.forEach(function(r){ byRoom[r.key] = []; });

    var base = new Date(now.getFullYear(), now.getMonth(), now.getDate());

    for (var offset = 0; offset <= LOOKAHEAD_DAYS; offset++){
      var day = new Date(base.getTime() + offset * 86400000);
      var dom = day.getDate();
      var mIdx = day.getMonth();
      var yr = day.getFullYear();

      (state.rows || []).forEach(function(r){
        var name = (r[0] || "").trim();
        var when = r[2] || "";
        var blurb = (r[3] || "").trim();
        if (!name || !when) return;
        if (!/banshee/i.test(when)) return;

        var p = parseWhen(when);
        if (!p) return;
        if (p.monthIdx !== mIdx) return;
        if (p.days.indexOf(dom) === -1) return;

        var room = null;
        for (var i = 0; i < ROOMS.length; i++){ if (ROOMS[i].match.test(p.roomText)){ room = ROOMS[i]; break; } }
        if (!room) return;

        var start = new Date(yr, mIdx, dom, 0, p.startMin, 0);
        var end   = new Date(yr, mIdx, dom, 0, p.endMin, 0);
        if (end <= now) return; // already finished

        byRoom[room.key].push({ name: name, blurb: blurb, start: start, end: end,
                                 startLabel: p.startLabel, endLabel: p.endLabel });
      });
    }

    ROOMS.forEach(function(r){
      byRoom[r.key].sort(function(a,b){ return a.start - b.start; });
      byRoom[r.key] = byRoom[r.key].slice(0, SHOWS_PER_ROOM);
    });

    return byRoom;
  }

  function escapeHTML(s){
    return String(s || "").replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function render(){
    var mount = document.getElementById('rooms');
    var status = document.getElementById('status');

    if (state.ok === false){
      status.textContent = "Couldn't reach today's listings — retrying…";
      status.className = "error";
      return;
    }
    status.textContent = "Updates automatically through the day";
    status.className = "";

    var now = new Date();
    var byRoom = buildOccurrences();

    mount.innerHTML = ROOMS.map(function(room){
      var shows = byRoom[room.key];

      if (!shows.length){
        return '<section class="room">'
          + '<div class="room-head"><span class="room-name">' + room.name + '</span><span class="tag empty">—</span></div>'
          + '<div class="room-empty">Nothing scheduled here right now.</div>'
          + '</section>';
      }

      var headTag = (shows[0].start <= now && now < shows[0].end)
        ? '<span class="tag now">On now</span>'
        : '<span class="tag next">Up next</span>';

      var items = shows.map(function(s){
        var dl = dayLabel(s.start, now);
        return '<li class="show-item">'
          + '<div class="item-meta"><span class="item-day' + (dl.isToday ? ' today' : '') + '">' + dl.text + '</span>'
          + '<span class="item-time">' + s.startLabel + ' – ' + s.endLabel + '</span></div>'
          + '<div class="item-title">' + escapeHTML(s.name) + '</div>'
          + (s.blurb ? '<div class="item-desc">' + escapeHTML(s.blurb) + '</div>' : '')
          + '</li>';
      }).join('');

      return '<section class="room">'
        + '<div class="room-head"><span class="room-name">' + room.name + '</span>' + headTag + '</div>'
        + '<ul class="show-list">' + items + '</ul>'
        + '</section>';
    }).join('');
  }

  function tickClock(){
    document.getElementById('clock').textContent = fmtClock(new Date());
  }

  function load(){
    var url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID
            + '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(SHEET_TAB)
            + '&_=' + Date.now();
    fetch(url, { cache: 'no-store' })
      .then(function(res){ if (!res.ok) throw new Error('bad status'); return res.text(); })
      .then(function(text){
        var rows = parseCSV(text).filter(function(r){ return r.length > 1; });
        if (rows.length && !/\d{1,2}:\d{2}/.test(rows[0][2] || '')) rows = rows.slice(1);
        state.rows = rows;
        state.ok = true;
        render();
      })
      .catch(function(){
        state.ok = false;
        render();
      });
  }

  tickClock();
  render();
  load();
  setInterval(tickClock, 1000);
  setInterval(render, TICK_MS);
  setInterval(load, REFRESH_MS);
})();
</script>
</body>
</html>
