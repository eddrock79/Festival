<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>The Banshee Labyrinth — Up Next</title>
<meta name="theme-color" content="#060507">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600&family=EB+Garamond:ital,wght@0,400;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#050507;
    --panel:#0b0a0d;
    --bone:#f0eadc;
    --bone-dim:rgba(240,234,220,.66);
    --green:#72dfc0;
    --ember:#c31935;
    --ember-bright:#ef465c;
    --line:rgba(240,234,220,.14);
    --line-soft:rgba(240,234,220,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100svh;
    background:
      radial-gradient(65vw 32vh at 50% -5%,rgba(114,223,192,.10),transparent 68%),
      radial-gradient(80vw 45vh at 0% 72%,rgba(195,25,53,.055),transparent 68%),
      #050507;
    color:var(--bone);
    font-family:'EB Garamond',serif;
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .veil{position:fixed;inset:0;pointer-events:none;z-index:0;background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.18) 55%,rgba(0,0,0,.34) 100%)}
  header{position:relative;z-index:1;text-align:center;padding:18px 16px 7px}
  .brand-logo{display:block;width:min(76vw,350px);height:auto;margin:0 auto;mix-blend-mode:screen;filter:drop-shadow(0 0 24px rgba(114,223,192,.10))}
  .festival-kicker{margin-top:10px;font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--green)}
  .date-line{margin-top:5px;font-family:'Cinzel',serif;font-size:clamp(.72rem,3.2vw,.84rem);letter-spacing:.07em;color:var(--bone-dim)}
  .clock{display:inline-flex;align-items:center;margin-left:8px;color:var(--bone-dim)}
  .clock .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px;box-shadow:0 0 9px rgba(114,223,192,.85);animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  main{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:12px 14px 36px}
  .intro{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:4px 4px 11px}
  .intro-title{font-family:'Cinzel Decorative',serif;font-size:clamp(1.08rem,5vw,1.4rem);line-height:1.05;text-transform:uppercase}
  .intro-sub{margin-top:4px;font-size:.98rem;color:var(--bone-dim)}
  .live-key{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.13em;text-transform:uppercase;color:var(--green);white-space:nowrap}

  .room{position:relative;margin-top:14px;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(0,0,0,.32));box-shadow:0 12px 36px rgba(0,0,0,.22)}
  .room::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--green),rgba(114,223,192,.06));opacity:.85}
  .room-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 17px 12px 19px;border-bottom:1px solid var(--line-soft)}
  .room-name{font-family:'Cinzel Decorative',serif;font-weight:700;letter-spacing:.02em;text-transform:uppercase;font-size:clamp(.92rem,4vw,1.08rem)}
  .room-state{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
  .room-state.now{color:#07100d;background:var(--green);padding:5px 8px;border-radius:999px;font-weight:600}
  .room-state.next{color:var(--green)}
  .room-state.empty{color:var(--bone-dim)}

  .feature{padding:15px 17px 15px 19px}
  .feature-status{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase}
  .status-pill{padding:4px 8px;border-radius:999px;border:1px solid rgba(114,223,192,.38);color:var(--green)}
  .status-pill.on{background:rgba(195,25,53,.16);border-color:rgba(239,70,92,.5);color:#ff8393}
  .countdown{color:var(--bone-dim)}
  .feature-title{margin-top:9px;font-family:'EB Garamond',serif;font-size:clamp(1.48rem,6.2vw,1.85rem);font-weight:600;line-height:1.04;color:#fffaf0;text-wrap:balance}
  .feature-time{margin-top:7px;font-size:1.04rem;color:var(--ember-bright);font-weight:600}
  .feature-desc{margin-top:7px;font-size:1rem;line-height:1.4;color:var(--bone-dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  .next-strip{border-top:1px solid var(--line-soft);padding:9px 17px 10px 19px;background:rgba(255,255,255,.015)}
  .next-label{font-family:'Cinzel',serif;font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;color:var(--bone-dim);margin-bottom:2px}
  .next-row{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:6px 0;border-top:1px solid rgba(240,234,220,.055)}
  .next-row:first-of-type{border-top:none}
  .next-time{font-weight:600;color:var(--green)}
  .next-title{font-size:1.01rem;line-height:1.18;color:var(--bone)}

  details.more{border-top:1px solid var(--line-soft)}
  details.more summary{list-style:none;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:10px 17px 11px 19px;font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-dim);display:flex;justify-content:space-between}
  details.more summary::-webkit-details-marker{display:none}
  .show-list{margin:0;padding:0 17px 8px 19px;list-style:none}
  .show-item{padding:10px 0;border-top:1px solid var(--line-soft)}
  .item-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .item-day{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--green)}
  .item-day.today{color:var(--bone-dim)}
  .item-time{font-weight:600;font-size:.92rem;color:var(--ember-bright)}
  .item-title{margin-top:3px;font-weight:600;font-size:1.08rem;line-height:1.18}
  .item-desc{margin-top:4px;font-size:.94rem;line-height:1.35;color:var(--bone-dim)}
  .room-empty{padding:18px 19px 20px;color:var(--bone-dim);font-style:italic}
  footer{position:relative;z-index:1;text-align:center;padding:0 16px 28px;font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ember-bright)}
  footer:empty{padding:0}
  @media (min-width:700px){header{padding-top:24px}.brand-logo{width:min(50vw,390px)}main{padding-left:18px;padding-right:18px}}
  @media (prefers-reduced-motion:reduce){.clock .dot{animation:none}}
</style>
</head>

    var startOfOcc = new Date(occDate.getFullYear(), occDate.getMonth(), occDate.getDate());
    var diffDays = Math.round((startOfOcc - startOfToday) / 86400000);
    if (diffDays === 0) return { text: "Today", isToday: true };
    if (diffDays === 1) return { text: "Tomorrow", isToday: false };
    return { text: occDate.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' }), isToday: false };
  }

  function minsUntil(d, now){ return Math.max(0, Math.ceil((d-now)/60000)); }
  function durationText(start,end){ return Math.max(1, Math.round((end-start)/60000)) + " mins"; }
  function statusInfo(s, now){
    if (s.start <= now && now < s.end){
      var left = Math.max(1, Math.ceil((s.end-now)/60000));
      return {pill:"ON NOW", cls:"on", extra:left+" min remaining"};
    }
    var mins = minsUntil(s.start, now);
    if (mins < 60) return {pill:"UP NEXT", cls:"", extra:"Starts in "+mins+" min"};
    return {pill:"UP NEXT", cls:"", extra:dayLabel(s.start,now).text+" · "+s.startLabel};
  }

  // ── Build every future occurrence within the lookahead window, one per room ──
  function buildOccurrences(){
    var now = new Date();
    var byRoom = {};
    ROOMS.forEach(function(r){ byRoom[r.key] = []; });

    var base = new Date(now.getFullYear(), now.getMonth(), now.getDate());

    for (var offset = 0; offset <= LOOKAHEAD_DAYS; offset++){
      var day = new Date(base.getTime() + offset * 86400000);
      var dom = day.getDate();
      var mIdx = day.getMonth();
      var yr = day.getFullYear();

      (state.rows || []).forEach(function(r){
        var name = (r[0] || "").trim();
        var when = r[2] || "";
        var blurb = (r[3] || "").trim();
        if (!name || !when) return;
        if (!/banshee/i.test(when)) return;

        var p = parseWhen(when);
        if (!p) return;
        if (p.monthIdx !== mIdx) return;
        if (p.days.indexOf(dom) === -1) return;

        var room = null;
        for (var i = 0; i < ROOMS.length; i++){ if (ROOMS[i].match.test(p.roomText)){ room = ROOMS[i]; break; } }
        if (!room) return;

        var start = new Date(yr, mIdx, dom, 0, p.startMin, 0);
        var end   = new Date(yr, mIdx, dom, 0, p.endMin, 0);
        if (end <= now) return; // already finished

        byRoom[room.key].push({ name: name, blurb: blurb, start: start, end: end,
                                 startLabel: p.startLabel, endLabel: p.endLabel });
      });
    }

    ROOMS.forEach(function(r){
      byRoom[r.key].sort(function(a,b){ return a.start - b.start; });
      byRoom[r.key] = byRoom[r.key].slice(0, SHOWS_PER_ROOM);
    });

    return byRoom;
  }

  function escapeHTML(s){
    return String(s || "").replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function render(){
    var mount = document.getElementById('rooms');
    var status = document.getElementById('status');

    if (state.ok === false){
      status.textContent = "Couldn't reach today's listings — retrying…";
      return;
    }
    status.textContent = "";

    var now = new Date();
    var byRoom = buildOccurrences();

    mount.innerHTML = ROOMS.map(function(room){
      var shows = byRoom[room.key];
      if (!shows.length){
        return '<section class="room"><div class="room-head"><span class="room-name">'+room.name+'</span><span class="room-state empty">No shows</span></div><div class="room-empty">Nothing else scheduled here right now.</div></section>';
      }

      var first = shows[0];
      var live = first.start <= now && now < first.end;
      var info = statusInfo(first, now);
      var remaining = shows.slice(1,3);
      var later = shows.slice(3);
      var roomState = live ? '<span class="room-state now">On now</span>' : '<span class="room-state next">Up next</span>';

      var html = '<section class="room">'
        + '<div class="room-head"><span class="room-name">'+room.name+'</span>'+roomState+'</div>'
        + '<div class="feature">'
        + '<div class="feature-status"><span class="status-pill '+info.cls+'">'+info.pill+'</span><span class="countdown">'+info.extra+'</span></div>'
        + '<div class="feature-title">'+escapeHTML(first.name)+'</div>'
        + '<div class="feature-time">'+first.startLabel+' – '+first.endLabel+' · '+durationText(first.start,first.end)+'</div>'
        + (first.blurb ? '<div class="feature-desc">'+escapeHTML(first.blurb)+'</div>' : '')
        + '</div>';

      if (remaining.length){
        html += '<div class="next-strip"><div class="next-label">Coming up</div>'
          + remaining.map(function(s){
              var dl=dayLabel(s.start,now);
              var t=dl.isToday?s.startLabel:(dl.text+' '+s.startLabel);
              return '<div class="next-row"><div class="next-time">'+t+'</div><div class="next-title">'+escapeHTML(s.name)+'</div></div>';
            }).join('')
          + '</div>';
      }

      if (later.length){
        html += '<details class="more"><summary><span>More shows</span><span>+</span></summary><ul class="show-list">'
          + later.map(function(s){
              var dl=dayLabel(s.start,now);
              return '<li class="show-item"><div class="item-meta"><span class="item-day'+(dl.isToday?' today':'')+'">'+dl.text+'</span><span class="item-time">'+s.startLabel+' – '+s.endLabel+'</span></div><div class="item-title">'+escapeHTML(s.name)+'</div>'+(s.blurb?'<div class="item-desc">'+escapeHTML(s.blurb)+'</div>':'')+'</li>';
            }).join('')
          + '</ul></details>';
      }
      return html + '</section>';
    }).join('');
  }

  function tickClock(){
    var now = new Date();
    document.getElementById('clock').textContent = fmtClock(now);
    var t = document.getElementById('todayLabel');
    if (t) t.textContent = now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  }

  function load(){
    var url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID
            + '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(SHEET_TAB)
            + '&_=' + Date.now();
    fetch(url, { cache: 'no-store' })
      .then(function(res){ if (!res.ok) throw new Error('bad status'); return res.text(); })
      .then(function(text){
        var rows = parseCSV(text).filter(function(r){ return r.length > 1; });
        if (rows.length && !/\d{1,2}:\d{2}/.test(rows[0][2] || '')) rows = rows.slice(1);
        state.rows = rows;
        state.ok = true;
        render();
      })
      .catch(function(){
        state.ok = false;
        render();
      });
  }

  tickClock();
  render();
  load();
  setInterval(tickClock, 1000);
  setInterval(render, TICK_MS);
  setInterval(load, REFRESH_MS);
})();
</script>
</body>
</html>
